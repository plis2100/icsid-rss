name: Actualizar expedientes del CIADI

on:
  workflow_dispatch:
  schedule:
    - cron: '23 7,11,15,19 * * 1-6'
      timezone: Europe/Madrid

permissions:
  contents: write

concurrency:
  group: actualizar-expedientes-ciadi
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install lxml
      - run: python actualizar_expedientes.py
      - name: Publicar el RSS y el estado
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rss-expedientes.xml estado-expedientes.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Actualizar expedientes del CIADI'
          for intento in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
          done
          exit 1
